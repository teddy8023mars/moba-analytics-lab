name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: moba-lab generate --output /tmp/fixture.json --seed 7
      - run: moba-lab run --input /tmp/fixture.json --as-of 2026-01-14 --output /tmp/report
  dbt-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dbt.txt .
      - run: dbt --version
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
          DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
