[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moba-analytics-lab"
version = "0.1.0"
description = "Synthetic MOBA analytics with explicit fact grains and observable retention"
requires-python = ">=3.11"
dependencies = ["duckdb==1.4.3"]
license = "MIT"

[project.scripts]
moba-lab = "moba_lab.cli:main"

[tool.setuptools.package-data]
moba_lab = ["*.sql"]

[tool.setuptools.packages.find]
where = ["src"]
